
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ACLS CPR Scribe</title>
    
    <!-- CDNs for styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script>
      // Protocol Check for iPhone/Mobile Local Opening
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', () => {
          document.body.innerHTML = `
            <div style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 30px; text-align: center; background: #f8fafc; color: #1e293b; height: 100vh; display: flex; flex-direction: column; justify-content: center;">
              <div style="font-size: 50px; margin-bottom: 20px;">🏥</div>
              <h1 style="font-weight: 900; letter-spacing: -1px; color: #e11d48;">LOCAL FILE BLOCKED</h1>
              <p style="margin: 20px 0; line-height: 1.5; font-size: 16px; color: #64748b;">
                Safari prevents local scripts from running for security.
              </p>
              <div style="background: white; border: 1px solid #e2e8f0; padding: 20px; border-radius: 16px; text-align: left; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
                <p style="margin: 0 0 10px 0; font-weight: bold; font-size: 14px;">Next Steps:</p>
                <ol style="padding-left: 20px; margin: 0; font-size: 13px; color: #334155;">
                  <li style="margin-bottom: 8px;">Push these changes to your GitHub repo.</li>
                  <li style="margin-bottom: 8px;">Vercel will now deploy successfully.</li>
                  <li>Open the Vercel URL and use <b>"Add to Home Screen"</b>.</li>
                </ol>
              </div>
            </div>
          `;
        });
      }
    </script>

    <style>
      /* Mobile Optimizations */
      -webkit-tap-highlight-color: transparent;
      body {
        overscroll-behavior-y: none;
        -webkit-user-select: none;
      }
      input {
        -webkit-user-select: text;
      }
      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
      }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
<script type="importmap">
